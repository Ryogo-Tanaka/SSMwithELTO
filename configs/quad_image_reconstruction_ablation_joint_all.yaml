# Ablation Study Config: Joint Training Mode (all parameters simultaneously)
# Base: quad_image_reconstruction_config.yaml
# Purpose: Baseline for comparison against staged training (proposed method)
# Data: data/rkn_quad/quad1_y.npz
# Architecture: cnn_imageEncoder + cnn_imageDecoder

experiment:
  mode: "reconstruction"

data:
  train_ratio: 0.7
  val_ratio: 0.2
  test_ratio: 0.1
  normalization: "unit_scale"  # [0,255] -> [0,1]
  batch_size: 300
  image_shape: [48, 48, 1]    # (H, W, C)
  paper_data_protocol: true    # train_obs->train, test_obs->eval (same as main config)

model:
  encoder:
    type: "cnn_image"              # cnn_imageEncoder
    input_resolution: [48, 48, 1]  # input image resolution (H, W, C)
    feature_dim: 50               # latent dimension
    hidden: 200                    # FC hidden dimension
    conv_channels: [32, 64]        # CNN channel sizes
    activation: "relu"
    normalize_input: false
    normalize_output: false
    track_running_stats: true

  decoder:
    type: "cnn_image"              # cnn_imageDecoder
    input_resolution: [48, 48, 1]  # output image resolution (H, W, C)
    feature_dim: 50               # latent dimension
    hidden: 200                    # FC hidden dimension
    grid: [12, 12, 64]            # intermediate grid size (H/4, W/4, Ch)
    upsample_mode: "nearest"       # upsampling method
    conv_channels: [64, 32, 1]     # deconv channel sizes
    activation: "relu"
    output_activation: "sigmoid"

  state_decoder:
    feature_dim: 50               # latent dimension
    state_dim: 8                   # control state dimension
    hidden: 50                     # hidden layer dimension
    activation: "relu"

training:
  epochs: 10               # total epochs (test: 10, full run: 50)
  T1_iterations: 1         # Stage-1 iterations (unused since Phase-1 is skipped)
  T2_iterations: 1         # Stage-2 iterations (unused since Phase-1 is skipped)
  phase1_warmup_epochs: 0  # Ablation: no warmup (Phase-2 from the start)

  experiment_mode: "reconstruction"
  target_loss_weight: 0.0
  reconstruction_loss_weight: 1.0

  # Phase-1 LR (not directly used since Phase-1 is skipped, but used by Phase-2 optimizer)
  lr_phi: 1e-4             # phi_theta LR
  lr_psi: 1e-4             # psi_omega LR
  weight_decay: 1e-6

  # Phase-2 LR (same as baseline)
  lr_encoder: 1e-5          # encoder LR
  lr_decoder: 1e-4          # decoder LR
  lambda_cca: 0.0001         # CCA loss weight
  update_strategy: "joint_all"  # Ablation: joint training mode (all params simultaneously)

ssm:
  realization:
    past_horizon: 20        # past window length
    rank: 30                 # state dimension
    encoder_output_dim: 50   # encoder output dimension
    ridge_param: 1e-3
    jitter: 1e-6

    feature_mapping:
      type: "mlp"      # averaging | linear | mlp
      hidden_dims: [32]
      activation: "relu"

  df_state:
    feature_dim: 50         # state feature dimension d_A
    lambda_A: 1e-3          # V_A regularization
    lambda_B: 1e-3          # U_A regularization
    feature_net:            # phi_theta net
      hidden_sizes: [128, 64]
      activation: "ReLU"
      dropout: 0.1
    cross_fitting:
      n_blocks: 5
      min_block_size: 100

  df_observation:
    obs_feature_dim: 25         # observation feature dimension d_B
    multivariate_feature_dim: 50  # encoder output dimension m
    lambda_B: 1e-3              # V_B regularization
    lambda_dB: 1e-3             # u_B regularization
    obs_net:                    # psi_omega net
      hidden_sizes: [64, 32]
      activation: "ReLU"
      dropout: 0.1
    cross_fitting:
      n_blocks: 5
      min_block_size: 100

computation:
  device: "auto"
  num_workers: 4
  pin_memory: true

output:
  save_model: true
  save_history: true
  create_plots: true
  save_reconstructions: true

logging:
  level: "INFO"
  console_output: true
  file_output: true

evaluation:
  use_new_realization: true

  reconstruction_metrics:
    metrics: ['reconstruction_rmse', 'psnr', 'temporal_correlation']
    max_samples: 100
    visualization: true

  reconstruction:
    metrics:
      - "mse"
      - "psnr"
      - "ssim"
    save_detailed_results: true

  encoded_feature_space_viz:
    dim_indices: [0, 1]
    max_samples: 100
