# ELTO-KF baseline config for quad-link image prediction (PROJ-REBUTTAL Step 8).
#
# Paper: Ke, Tanaka, Kawahara (AISTATS 2025), §6 Quad-link experiment.
# Architecture: Conv-Conv-FC encoder (m=50) + ConvTranspose decoder (mean, var).
# Training: per-frame Gaussian NLL on image, Adam lr=1e-3, 200 epochs.
# Spectral realization is computed once on training features after training.

method: elto_kf
dataset: quadlink
quadlink_data_root: /workspace/nas/SSMwithELTO/data/rkn_quad
regime: clean
data_seed: 1

# Model architecture
input_resolution: [48, 48, 1]
feature_dim: 50               # m (paper Table-2 description)
encoder_hidden: 200
past_horizon: 5               # h (paper §6 pendulum default)
state_dim: 50                 # r = m by default; SVD truncation may reduce
eps_te: 1.0e-3
eps_oe: 1.0e-3
cov_jitter: 1.0e-6
gamma_Q: 1.0e-6
gamma_R: 1.0e-6
var_floor: 1.0e-3

# Data / windowing
window_len: 30
stride: 1
val_size: 300

# Training (paper §6 quad-link: lr=1e-3, 200 epochs)
num_epochs: 200
batch_size: 32
learning_rate: 1.0e-3
weight_decay: 0.0
max_grad_norm: 10.0
device: cuda
num_workers: 0

# Logging / checkpointing
log_every_steps: 100
val_every_epochs: 5
save_every_epochs: 50

# Evaluation defaults
eval:
  ctx_len: 30
  protocol: dse
  rollout_horizons: [1, 5, 10, 20, 50]
  rollout_context_lens: [5, 10]
